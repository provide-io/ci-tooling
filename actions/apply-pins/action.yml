name: 'Apply Branch Pins'
description: 'Patch resolved pins into pyproject.toml so uv resolves those packages from a git ref'
author: 'provide.io llc'

# Script policy: no inline scripts beyond three lines. Logic lives in
# ci-tooling scripts/deps/ so it is testable outside a runner.
#
# Runs after uv is installed and before `uv sync`. It is a separate action from
# resolve-pins because setup-uv sits between the two: the digest resolve-pins
# emits has to reach setup-uv's cache-suffix before uv exists.

inputs:
  ci-tooling-path:
    description: 'Path the ci-tooling repository is checked out at. Defaults to this action''s own copy, so the scripts always match the ref the caller pinned'
    required: false
    default: ''
  pins:
    description: 'JSON array of resolved pins, from the resolve-pins action'
    required: true
  pyproject:
    description: 'Path to the pyproject.toml to patch'
    required: false
    default: 'pyproject.toml'

runs:
  using: 'composite'
  steps:
    # Merge the pins into [tool.uv] override-dependencies. uv honours overrides
    # only from pyproject.toml, so the file has to be rewritten on disk.
    - name: 📌 Apply pins to pyproject.toml
      if: inputs.pins != '[]' && inputs.pins != ''
      shell: bash
      env:
        CI_TOOLING_PATH: ${{ inputs.ci-tooling-path != '' && inputs.ci-tooling-path || format('{0}/../..', github.action_path) }}
        PINS: ${{ inputs.pins }}
        PYPROJECT: ${{ inputs.pyproject }}
      run: "$CI_TOOLING_PATH/scripts/deps/apply-pins.sh"

branding:
  icon: 'anchor'
  color: 'blue'
