# CI workflow for a Python package.
#
# Copy into .github/workflows/. Everything below `with:` is optional -- the
# reusable workflow's defaults are documented in
# .github/workflows/python-ci.yml in this repository. `we tasks` lists what
# `use-wrknv: true` will run.
name: ⚙️ Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    # labeled/unlabeled are not in the default set, and without them a
    # `pin:<pkg>@<ref>` label cannot take effect: adding one starts no run, and
    # re-running replays the original payload, which had no label on it.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Re-run CI against an unreleased sibling branch without committing anything.
  # This is the highest-precedence pin layer; see docs/branch-pins.md for the
  # other five.
  workflow_dispatch:
    inputs:
      package-pins:
        description: 'Branch pins for this run, as <pkg>@<ref> (comma or newline separated)'
        type: string
        required: false
        default: ''

# security-events: write is what lets the security scan upload SARIF to the
# repository's code-scanning alerts. Drop it along with run-security if you
# are not using them.
permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: provide-io/ci-tooling/.github/workflows/python-ci.yml@v0
    with:
      python-version: '3.11'
      # Run checks through wrknv so CI and local dev use the same commands.
      use-wrknv: true
      # minimal (linux x64) | standard (+ macos) | full (+ windows).
      platform-preset: standard
      coverage-threshold: 80
      run-security: true
      run-secret-scan: true
      # Empty on push and pull_request; set only by a manual dispatch.
      dispatch-pins: ${{ inputs.package-pins || '' }}
    secrets: inherit
