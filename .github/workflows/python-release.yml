# The actions this workflow runs are pinned to a commit, not to @main.
#
# A consumer pins this workflow to a tag and reasonably expects everything it
# runs to be pinned with it. At @main they got whatever had landed on this
# branch since, which is not theoretical: a `vars.CI_PINS` expression added to
# setup-python-env made that action fail to load, and broke a release in a
# repository that had pinned this workflow to v0.4.3 and changed nothing
# itself.
#
# The cost is that changing one of these actions takes a second commit to move
# the pin -- the same bargain already made for every third-party action here.
# A consumer on an older tag keeps whatever that tag says; this takes effect
# from the next tag onward.
name: 'Reusable Python Release'

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        type: string
        default: '3.11'
      uv-version:
        description: 'UV version to use'
        type: string
        default: '0.11.3'
      build-backend:
        description: 'Build backend (uv, build)'
        type: string
        default: 'uv'
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        default: false
      run-tests:
        description: 'Run tests before release'
        type: boolean
        default: true
      parallel-tests:
        description: 'Run tests in parallel with pytest-xdist'
        type: boolean
        default: true
      create-github-release:
        description: 'Create a GitHub release from the built artifacts. Set false when the caller was triggered by an existing release.'
        type: boolean
        default: true

env:
  FORCE_COLOR: "1"
  UV_SYSTEM_PYTHON: "1"

# Default for every job below. Without it these jobs inherit whatever the
# caller granted at the `uses:` site, which is `contents: write` -- so the jobs
# that install a project's entire dependency tree from PyPI and execute it
# (tests, build) were holding a writable repository token. Only github-release
# needs write, and it asks for it explicitly. A new job added here starts
# read-only unless it says otherwise.
permissions:
  contents: read

# Publishing (TestPyPI + PyPI) intentionally stays in caller workflows:
# PyPI Trusted Publishing matches on OIDC job_workflow_ref, which points at
# the workflow that actually runs the publish action. If publish ran here in
# the reusable, every PyPI project would need its trusted publisher pointed
# at provide-io/ci-tooling/python-release.yml, defeating per-repo isolation.
# Callers consume the `release-artifacts` artifact from this workflow's build
# job and run their own publish-testpypi / publish-pypi / sign-and-upload.

jobs:
  # ==================================================================================
  # 🧪 Pre-release Tests
  # ==================================================================================
  # A release must never be cut from a tree that still pins a dependency to a
  # branch. Overrides do not reach the published wheel's metadata, but the tests
  # that gate the release would have run against unreleased code.
  pin-guard:
    name: 📌 Pin Guard
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 📥 Checkout ci-tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: provide-io/ci-tooling
          ref: ${{ github.job_workflow_sha || 'v0' }}
          path: .ci-tooling

      # Fails the release if any branch pin is still declared.
      - name: 📌 Check no pins are active
        run: python3 .ci-tooling/scripts/deps/check_no_pins.py

  pre-release-tests:
    name: 🧪 Pre-release Tests
    if: inputs.run-tests
    runs-on: ubuntu-24.04
    steps:
      # Fetch repo sources for test + quality runs
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Install the requested Python + uv toolchain via ci-tooling helper
      - name: 🐍 Setup Python Environment
        uses: provide-io/ci-tooling/actions/setup-python-env@d65d086993e06a79f3ef5e00e32addf2e26540af  # pinned, see header
        with:
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}
          # `vars` is a context a workflow can evaluate and a composite action
          # cannot, so it is read here and handed over.
          variable-pins: ${{ vars.CI_PINS }}

      # Lint/type-check using shared quality composite
      - name: 🎨 Quality Checks
        uses: provide-io/ci-tooling/actions/python-quality@d65d086993e06a79f3ef5e00e32addf2e26540af  # pinned, see header

      # Run the test suite; coverage gate intentionally disabled for release flow
      - name: 🧪 Run Tests
        uses: provide-io/ci-tooling/actions/python-test@d65d086993e06a79f3ef5e00e32addf2e26540af  # pinned, see header
        with:
          coverage-threshold: 0
          parallel: ${{ inputs.parallel-tests }}

  # ==================================================================================
  # 🏗️ Build Package
  # ==================================================================================
  build:
    name: 🏗️ Build Package
    needs: [pre-release-tests, pin-guard]
    if: always() && needs.pin-guard.result == 'success' && (needs.pre-release-tests.result == 'success' || !inputs.run-tests)
    runs-on: ubuntu-24.04
    steps:
      # Full clone needed for version extraction from tags
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Build environment: no dev group since we're only producing wheels/sdist
      - name: 🐍 Setup Python Environment
        uses: provide-io/ci-tooling/actions/setup-python-env@d65d086993e06a79f3ef5e00e32addf2e26540af  # pinned, see header
        with:
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}
          # `vars` is a context a workflow can evaluate and a composite action
          # cannot, so it is read here and handed over.
          variable-pins: ${{ vars.CI_PINS }}
          install-group: ''

      # Produce wheel + sdist into dist/
      - name: 🏗️ Build Package
        uses: provide-io/ci-tooling/actions/python-build@d65d086993e06a79f3ef5e00e32addf2e26540af  # pinned, see header
        with:
          build-backend: ${{ inputs.build-backend }}

      # Share artifacts with downstream caller jobs (publish-testpypi, publish-pypi, etc.)
      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: release-artifacts
          path: dist/*
          retention-days: 30

  # ==================================================================================
  # 🏷️ Create GitHub Release (optional)
  # ==================================================================================
  github-release:
    name: 🏷️ GitHub Release
    needs: [build]
    # Skip when the caller was triggered by an already-existing release
    if: always() && needs.build.result == 'success' && inputs.create-github-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Full clone so release-notes generation can walk history
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Pull the just-built artifacts for attaching to the release
      - name: 📦 Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-artifacts
          path: dist/

      # Create the GH release tagged vX.Y.Z with artifacts attached
      - name: 🏷️ Create GitHub Release
        uses: provide-io/ci-tooling/actions/github-release@d65d086993e06a79f3ef5e00e32addf2e26540af  # pinned, see header
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifacts-path: dist/
          prerelease: ${{ inputs.prerelease }}

  # ==================================================================================
  # 🚧 Publishing Gate
  # ==================================================================================
  publishing-gate:
    name: 🚧 Publishing Gate
    needs: [build, github-release]
    # Run whenever the build succeeded; github-release may be skipped
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      # Summary for humans; callers use `needs: [release]` on this workflow to gate publish-testpypi / publish-pypi
      - name: 📋 Report Gate Status
        env:
          R_BUILD: ${{ needs.build.result }}
          R_GHREL: ${{ needs.github-release.result }}
        run: |
          printf '## 🚧 Publishing Gate\n\nbuild=%s  github-release=%s\n\nArtifacts (release-artifacts) ready for caller publish.\n' \
            "$R_BUILD" "$R_GHREL" >> "$GITHUB_STEP_SUMMARY"
