name: '⚙️ Continuous Integration'

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        type: string
        default: '3.11'
      uv-version:
        description: 'UV version to use'
        type: string
        default: '0.11.3'
      source-paths:
        description: 'Source paths for quality checks'
        type: string
        default: 'src/ tests/'
      test-directory:
        description: 'Test directory'
        type: string
        default: 'tests/'
      coverage-threshold:
        description: 'Coverage threshold percentage'
        type: number
        default: 80
      run-security:
        description: 'Run security scanning (bandit)'
        type: boolean
        default: true
      run-secret-scan:
        description: 'Run secret scanning (TruffleHog, Gitleaks)'
        type: boolean
        default: true
      run-performance:
        description: 'Run performance tests'
        type: boolean
        default: false
      matrix-testing:
        description: 'Enable matrix testing across Python versions (3.11, 3.12, 3.13)'
        type: boolean
        default: false
      platform-preset:
        description: 'Platform preset: minimal (linux x64 only), standard (linux + macos), full (+ windows)'
        type: string
        default: 'standard'
      include-windows:
        description: 'Include Windows amd64 (off by default, overrides preset)'
        type: boolean
        default: false
      # Separate from include-windows because the two are not equally available.
      # A project can be healthy on Windows amd64 and unable to install at all
      # on Windows arm64: grpcio 1.83.0 publishes win32 and win_amd64 wheels
      # only (grpc/grpc#39064 open upstream) and cryptography 50.0.0 publishes
      # win_amd64 only, so anything requiring them fails during `uv sync` on
      # windows-11-arm long before a test runs. Asking for Windows coverage
      # should not force a caller to take a permanently red job.
      include-windows-arm:
        description: 'Include Windows arm64 (off by default; see the note above on wheel availability)'
        type: boolean
        default: false
      fail-fast:
        description: 'Fail fast in matrix builds'
        type: boolean
        default: false
      upload-coverage:
        description: 'Upload coverage to Codecov'
        type: boolean
        default: false
      parallel-testing:
        description: 'Enable parallel test execution with pytest-xdist (may break with some pytest plugins)'
        type: boolean
        default: true
      use-wrknv:
        description: 'Run checks via this repo''s wrknv task runner (we run <task>) instead of raw tool invocations, for local/CI command parity'
        type: boolean
        default: false
      run-tests:
        description: 'Run the pytest job(s). Disable for repos whose real verification is not pytest-based (e.g. binary conformance suites)'
        type: boolean
        default: true
      no-sources:
        description: 'Resolve dependencies from the registry, ignoring [tool.uv.sources]. Suite repos point siblings at ../<repo> for local development; CI checks out one repo, so those paths do not exist here and the published metadata is what should be verified anyway'
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        description: 'Codecov token for coverage upload'
        required: false

env:
  # NOTE: Do NOT set FORCE_COLOR=1 here - it breaks pytest-xdist's execnet
  # subprocess communication which expects plain output during bootstrap
  UV_SYSTEM_PYTHON: "1"
  # provide-foundation's tests/utils/timing.apply_timeout_factor() scales any
  # timeout >= 5s by this factor when set. Real-time filesystem-watcher tests
  # in that repo need the slack under -n auto's CPU contention; unused by
  # every other repo on this workflow, so it's a no-op elsewhere.
  PROVIDE_TEST_TIMEOUT_FACTOR: "3"

jobs:
  # ==================================================================================
  # 🔧 Code Quality & Type Checking
  # ==================================================================================
  quality:
    name: 🔧 Code Quality
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 📥 Checkout ci-tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: provide-io/ci-tooling
          ref: v0
          path: .ci-tooling

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: ⚡ Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: true

      - name: 📦 Install dependencies
        if: ${{ !inputs.use-wrknv }}
        run: uv sync --group dev ${{ inputs.no-sources && '--no-sources' || '' }}

      - name: 📦 Install dependencies (wrknv)
        if: inputs.use-wrknv
        run: uv sync --all-groups ${{ inputs.no-sources && '--no-sources' || '' }}

      - name: 🔧 Install wrknv
        if: inputs.use-wrknv
        run: uv pip install --python .venv/bin/python "wrknv @ git+https://github.com/provide-io/wrknv.git@main"

      - name: 🎨 Check formatting with Ruff
        if: ${{ !inputs.use-wrknv }}
        run: |
          source .venv/bin/activate
          .ci-tooling/scripts/quality/run-ruff-format.sh "${{ inputs.source-paths }}" true

      - name: 🎨 Check formatting (wrknv)
        if: inputs.use-wrknv
        run: .venv/bin/we run format.check

      - name: 🔍 Lint with Ruff
        if: ${{ !inputs.use-wrknv }}
        run: |
          source .venv/bin/activate
          .ci-tooling/scripts/quality/run-ruff-lint.sh "${{ inputs.source-paths }}" false

      - name: 🔍 Lint (wrknv)
        if: inputs.use-wrknv
        run: .venv/bin/we run lint

      - name: 🔒 Type check with MyPy
        if: ${{ !inputs.use-wrknv }}
        run: |
          source .venv/bin/activate
          .ci-tooling/scripts/quality/run-mypy.sh src/ false || true

      - name: 🔒 Type check (wrknv)
        if: inputs.use-wrknv
        run: .venv/bin/we run typecheck

  # ==================================================================================
  # 🧪 Tests - Platform Matrix
  # ==================================================================================
  test:
    name: 🧪 Tests (linux_amd64, py${{ matrix.python-version }})
    needs: quality
    if: inputs.run-tests
    runs-on: ubuntu-24.04
    strategy:
      # act cannot evaluate workflow_call boolean expressions here.
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.matrix-testing && '["3.11", "3.12", "3.13"]' || format('["{0}"]', inputs.python-version)) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 📥 Checkout ci-tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: provide-io/ci-tooling
          ref: v0
          path: .ci-tooling

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: ⚡ Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: true

      - name: 📦 Install dependencies
        if: ${{ !inputs.use-wrknv }}
        run: uv sync --group dev ${{ inputs.no-sources && '--no-sources' || '' }}

      - name: 📦 Install dependencies (wrknv)
        if: inputs.use-wrknv
        run: uv sync --all-groups ${{ inputs.no-sources && '--no-sources' || '' }}

      - name: 🔧 Install wrknv
        if: inputs.use-wrknv
        run: uv pip install --python .venv/bin/python "wrknv @ git+https://github.com/provide-io/wrknv.git@main"

      - name: 🧪 Run Tests
        if: ${{ !inputs.use-wrknv }}
        run: |
          source .venv/bin/activate
          .ci-tooling/scripts/test/run-pytest.sh "${{ inputs.test-directory }}" ${{ inputs.coverage-threshold }} ${{ inputs.parallel-testing }}

      - name: 🧪 Run Tests (wrknv)
        if: inputs.use-wrknv
        run: .venv/bin/we run ci.test

      - name: 📤 Upload Coverage
        if: inputs.upload-coverage && !inputs.use-wrknv && github.actor != 'nektos/act'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests
          name: codecov-linux_amd64-py${{ matrix.python-version }}

  # Additional platform tests (standard/full presets)
  test-linux-arm:
    name: 🧪 Tests (linux_arm64, py${{ matrix.python-version }})
    needs: quality
    if: inputs.run-tests && (inputs.platform-preset == 'standard' || inputs.platform-preset == 'full') && github.actor != 'nektos/act'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.matrix-testing && '["3.11", "3.12", "3.13"]' || format('["{0}"]', inputs.python-version)) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 📥 Checkout ci-tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: provide-io/ci-tooling
          ref: v0
          path: .ci-tooling

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: ⚡ Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: true

      - name: 📦 Install dependencies
        if: ${{ !inputs.use-wrknv }}
        run: uv sync --group dev ${{ inputs.no-sources && '--no-sources' || '' }}

      - name: 📦 Install dependencies (wrknv)
        if: inputs.use-wrknv
        run: uv sync --all-groups ${{ inputs.no-sources && '--no-sources' || '' }}

      - name: 🔧 Install wrknv
        if: inputs.use-wrknv
        run: uv pip install --python .venv/bin/python "wrknv @ git+https://github.com/provide-io/wrknv.git@main"

      - name: 🧪 Run Tests
        if: ${{ !inputs.use-wrknv }}
        run: |
          source .venv/bin/activate
          .ci-tooling/scripts/test/run-pytest.sh "${{ inputs.test-directory }}" ${{ inputs.coverage-threshold }} ${{ inputs.parallel-testing }}

      - name: 🧪 Run Tests (wrknv)
        if: inputs.use-wrknv
        run: .venv/bin/we run ci.test

  test-macos-arm:
    name: 🧪 Tests (darwin_arm64, py${{ matrix.python-version }})
    needs: quality
    if: inputs.run-tests && (inputs.platform-preset == 'standard' || inputs.platform-preset == 'full') && github.actor != 'nektos/act'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.matrix-testing && '["3.11", "3.12", "3.13"]' || format('["{0}"]', inputs.python-version)) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 📥 Checkout ci-tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: provide-io/ci-tooling
          ref: v0
          path: .ci-tooling

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: ⚡ Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: true

      - name: 📦 Install dependencies
        if: ${{ !inputs.use-wrknv }}
        run: uv sync --group dev ${{ inputs.no-sources && '--no-sources' || '' }}

      - name: 📦 Install dependencies (wrknv)
        if: inputs.use-wrknv
        run: uv sync --all-groups ${{ inputs.no-sources && '--no-sources' || '' }}

      - name: 🔧 Install wrknv
        if: inputs.use-wrknv
        run: uv pip install --python .venv/bin/python "wrknv @ git+https://github.com/provide-io/wrknv.git@main"

      - name: 🧪 Run Tests
        if: ${{ !inputs.use-wrknv }}
        run: |
          source .venv/bin/activate
          .ci-tooling/scripts/test/run-pytest.sh "${{ inputs.test-directory }}" ${{ inputs.coverage-threshold }} ${{ inputs.parallel-testing }}

      - name: 🧪 Run Tests (wrknv)
        if: inputs.use-wrknv
        run: .venv/bin/we run ci.test

  test-macos-intel:
    name: 🧪 Tests (darwin_amd64, py${{ matrix.python-version }})
    needs: quality
    if: inputs.run-tests && (inputs.platform-preset == 'standard' || inputs.platform-preset == 'full') && github.actor != 'nektos/act'
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.matrix-testing && '["3.11", "3.12", "3.13"]' || format('["{0}"]', inputs.python-version)) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 📥 Checkout ci-tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: provide-io/ci-tooling
          ref: v0
          path: .ci-tooling

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: ⚡ Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: true

      - name: 📦 Install dependencies
        if: ${{ !inputs.use-wrknv }}
        run: uv sync --group dev ${{ inputs.no-sources && '--no-sources' || '' }}

      - name: 📦 Install dependencies (wrknv)
        if: inputs.use-wrknv
        run: uv sync --all-groups ${{ inputs.no-sources && '--no-sources' || '' }}

      - name: 🔧 Install wrknv
        if: inputs.use-wrknv
        run: uv pip install --python .venv/bin/python "wrknv @ git+https://github.com/provide-io/wrknv.git@main"

      - name: 🧪 Run Tests
        if: ${{ !inputs.use-wrknv }}
        run: |
          source .venv/bin/activate
          .ci-tooling/scripts/test/run-pytest.sh "${{ inputs.test-directory }}" ${{ inputs.coverage-threshold }} ${{ inputs.parallel-testing }}

      - name: 🧪 Run Tests (wrknv)
        if: inputs.use-wrknv
        run: .venv/bin/we run ci.test

  # Windows amd64 tests (full preset or include-windows)
  test-windows:
    name: 🧪 Tests (windows_amd64, py${{ matrix.python-version }})
    needs: quality
    if: inputs.run-tests && (inputs.platform-preset == 'full' || inputs.include-windows) && github.actor != 'nektos/act'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.matrix-testing && '["3.11", "3.12", "3.13"]' || format('["{0}"]', inputs.python-version)) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 📥 Checkout ci-tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: provide-io/ci-tooling
          ref: v0
          path: .ci-tooling

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: ⚡ Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: true

      - name: 📦 Install dependencies
        run: uv sync --group dev ${{ inputs.no-sources && '--no-sources' || '' }}

      - name: 🧪 Run Tests
        shell: pwsh
        run: |
          .venv\Scripts\Activate.ps1
          pytest ${{ inputs.test-directory }} -v --tb=short

  test-windows-arm:
    name: 🧪 Tests (windows_arm64, py${{ matrix.python-version }})
    needs: quality
    # `full` still means every platform, so a caller asking for full is
    # unaffected. What changed is that include-windows no longer drags arm64
    # in with it.
    if: inputs.run-tests && (inputs.platform-preset == 'full' || inputs.include-windows-arm) && github.actor != 'nektos/act'
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.matrix-testing && '["3.11", "3.12", "3.13"]' || format('["{0}"]', inputs.python-version)) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 📥 Checkout ci-tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: provide-io/ci-tooling
          ref: v0
          path: .ci-tooling

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: ⚡ Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: true

      - name: 📦 Install dependencies
        run: uv sync --group dev ${{ inputs.no-sources && '--no-sources' || '' }}

      - name: 🧪 Run Tests
        shell: pwsh
        run: |
          .venv\Scripts\Activate.ps1
          pytest ${{ inputs.test-directory }} -v --tb=short

  # ==================================================================================
  # 🔒 Security Scanning
  # ==================================================================================
  security:
    name: 🔒 Security
    needs: quality
    if: inputs.run-security
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 📥 Checkout ci-tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: provide-io/ci-tooling
          ref: v0
          path: .ci-tooling

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: ⚡ Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: true

      - name: 📦 Install dependencies
        if: ${{ !inputs.use-wrknv }}
        run: |
          uv sync --group dev ${{ inputs.no-sources && '--no-sources' || '' }}
          source .venv/bin/activate
          uv pip install bandit pip-audit

      - name: 📦 Install dependencies (wrknv)
        if: inputs.use-wrknv
        run: uv sync --all-groups ${{ inputs.no-sources && '--no-sources' || '' }}

      - name: 🔧 Install wrknv
        if: inputs.use-wrknv
        run: |
          uv pip install --python .venv/bin/python "wrknv @ git+https://github.com/provide-io/wrknv.git@main"
          uv pip install --python .venv/bin/python pip-audit

      - name: 🔒 Run Bandit security scan
        if: ${{ !inputs.use-wrknv }}
        run: |
          source .venv/bin/activate
          .ci-tooling/scripts/security/run-bandit.sh src/ bandit-report.json -ll

      - name: 🔒 Run Bandit (wrknv)
        if: inputs.use-wrknv
        run: .venv/bin/we run security

      - name: 🔍 Check for known vulnerabilities
        run: |
          source .venv/bin/activate
          .ci-tooling/scripts/security/run-pip-audit.sh pip-audit-report.json

      - name: 📤 Upload security reports
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json

  # ==================================================================================
  # 🔐 Secret Scanning
  # ==================================================================================
  secret-scan:
    name: 🔐 Secret Scan
    needs: quality
    if: inputs.run-secret-scan && github.actor != 'nektos/act'
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: 🔐 TruffleHog Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
        continue-on-error: true

      - name: 🔐 Gitleaks Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ==================================================================================
  # 📦 Build Package
  # ==================================================================================
  build:
    name: 📦 Build
    needs: [test, test-linux-arm, test-macos-arm, test-macos-intel]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: ⚡ Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: false  # Build doesn't need cache, just runs uv build

      - name: 📦 Build Package
        run: uv build

      - name: 📤 Upload Dist Artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: dist
          path: dist/

  # ==================================================================================
  # 📋 CI Summary
  # ==================================================================================
  summary:
    name: 📋 CI Summary
    needs: [quality, test, test-linux-arm, test-macos-arm, test-macos-intel, test-windows, test-windows-arm, security, secret-scan, build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 📋 Generate Summary
        run: |
          echo "## 🎯 CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platform Preset:** ${{ inputs.platform-preset }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quality | ${{ needs.quality.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests (linux_amd64) | ${{ needs.test.result == 'success' && '✅ Passed' || (needs.test.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests (linux_arm64) | ${{ needs.test-linux-arm.result == 'success' && '✅ Passed' || (needs.test-linux-arm.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests (darwin_arm64) | ${{ needs.test-macos-arm.result == 'success' && '✅ Passed' || (needs.test-macos-arm.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests (darwin_amd64) | ${{ needs.test-macos-intel.result == 'success' && '✅ Passed' || (needs.test-macos-intel.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ inputs.platform-preset }}" = "full" ] || [ "${{ inputs.include-windows }}" = "true" ]; then
            echo "| Tests (windows_amd64) | ${{ needs.test-windows.result == 'success' && '✅ Passed' || (needs.test-windows.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ inputs.platform-preset }}" = "full" ] || [ "${{ inputs.include-windows-arm }}" = "true" ]; then
            echo "| Tests (windows_arm64) | ${{ needs.test-windows-arm.result == 'success' && '✅ Passed' || (needs.test-windows-arm.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "| Build | ${{ needs.build.result == 'success' && '✅ Passed' || (needs.build.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ inputs.run-security }}" = "true" ]; then
            echo "| Security | ${{ needs.security.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ inputs.run-secret-scan }}" = "true" ]; then
            echo "| Secret Scan | ${{ needs.secret-scan.result == 'success' && '✅ Passed' || '⚠️ Issues' }} |" >> $GITHUB_STEP_SUMMARY
          fi

          # Overall status (skipped test/build jobs are OK when run-tests: false)
          OVERALL="✅ Success"
          if [ "${{ needs.quality.result }}" != "success" ]; then
            OVERALL="❌ Failed"
          fi
          if [ "${{ needs.test.result }}" != "success" ] && [ "${{ needs.test.result }}" != "skipped" ]; then
            OVERALL="❌ Failed"
          fi
          if [ "${{ needs.build.result }}" != "success" ] && [ "${{ needs.build.result }}" != "skipped" ]; then
            OVERALL="❌ Failed"
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Overall Result:** $OVERALL" >> $GITHUB_STEP_SUMMARY
