name: Test Actions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      package-pins:
        description: 'Pins for the dispatch-layer test, as <pkg>@<ref>'
        type: string
        required: false
        default: 'provide-foundation@main'

env:
  FORCE_COLOR: "1"

jobs:
  # ==================================================================================
  # 🧪 Test Individual Actions
  # ==================================================================================
  test-setup-python-env:
    name: 🐍 Test setup-python-env
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🧪 Test setup-python-env action
        uses: ./actions/setup-python-env
        with:
          python-version: '3.11'
          uv-version: '0.11.3'
          cache-dependencies: false

      - name: ✅ Verify installation
        shell: bash
        run: |
          source ./.venv/bin/activate
          python --version
          uv --version
          echo "✅ setup-python-env test passed"

  test-python-quality:
    name: 🎨 Test python-quality
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🐍 Setup Python Environment
        uses: ./actions/setup-python-env
        with:
          python-version: '3.11'
          cache-dependencies: false

      # Writes a ruff-clean test_src/example.py for the action to check.
      - name: 📝 Create test files
        shell: bash
        run: bash ci/make-quality-fixture.sh

      - name: 🧪 Test python-quality action
        uses: ./actions/python-quality
        with:
          source-paths: 'test_src/'

  test-python-test:
    name: 🧪 Test python-test
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🐍 Setup Python Environment
        uses: ./actions/setup-python-env
        with:
          python-version: '3.11'
          cache-dependencies: false

      # pytest and pytest-cov are what the python-test action shells out to.
      - name: 📦 Install test dependencies
        shell: bash
        run: uv pip install --python ./.venv/bin/python pytest pytest-cov

      # Writes test_src/, test_tests/ and the root conftest.py that puts the
      # workspace on sys.path so test_src is importable.
      - name: 📝 Create test files
        shell: bash
        run: bash ci/make-test-fixture.sh

      - name: 🧪 Test python-test action
        uses: ./actions/python-test
        with:
          test-directory: 'test_tests/'
          coverage-threshold: 50

  # NOTE: test-python-security removed - action doesn't exist yet

  test-python-build:
    name: 🏗️ Test python-build
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🐍 Setup Python Environment
        uses: ./actions/setup-python-env
        with:
          python-version: '3.11'
          cache-dependencies: false

      - name: 📝 Create test package
        shell: bash
        run: |
          cat > pyproject.toml << 'EOF'
          [build-system]
          requires = ["setuptools>=61.0", "wheel"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "test-package"
          version = "0.1.0"
          description = "Test package for CI tooling"
          authors = [{name = "Test Author", email = "test@example.com"}]
          license = {text = "Apache-2.0"}
          requires-python = ">=3.11"

          [project.urls]
          Homepage = "https://github.com/provide-io/ci-tooling"
          EOF

          mkdir -p src/test_package
          cat > src/test_package/__init__.py << 'EOF'
          """Test package."""
          __version__ = "0.1.0"

          def hello():
              """Say hello."""
              return "Hello from test package!"
          EOF

      - name: 🧪 Test python-build action
        uses: ./actions/python-build
        with:
          build-backend: 'uv'

      - name: ✅ Verify build artifacts
        shell: bash
        run: |
          ls -la dist/
          echo "✅ python-build test passed"

  # ==================================================================================
  # 🔄 Test Reusable Workflows (temporarily disabled)
  # ==================================================================================
  # test-python-ci-workflow:
  #   name: 🔄 Test python-ci workflow
  #   uses: ./.github/workflows/python-ci.yml
  #   with:
  #     python-version: '3.11'
  #     source-paths: 'scripts/'
  #     test-directory: 'examples/'
  #     coverage-threshold: 50
  #     run-security: false
  #     matrix-testing: false

  # ==================================================================================
  # 📌 Test Branch Pin Layers
  # ==================================================================================
  test-pin-layers:
    name: 📌 Test pin layers
    # Exercises the three layers no real caller has driven yet. The others --
    # PR label, pins file, caller input -- are covered by live use.
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Layer 3: the CI_PINS repository variable.
      - name: 📌 Resolve from a repository variable
        id: variable
        uses: ./actions/resolve-pins
        with:
          ci-tooling-path: ${{ github.workspace }}
          variable-pins: 'provide-foundation@main'

      - name: ✅ Assert the variable layer resolved
        env:
          PINS: ${{ steps.variable.outputs.pins }}
        run: |
          ci/assert-pins.sh "CI_PINS variable" 1 '"layer": "repo-variable"' 'provide-io/provide-foundation@main'

      # Layer 1: a workflow_dispatch input, and that it outranks the variable.
      - name: 📌 Resolve a dispatch input over a variable
        id: dispatch
        uses: ./actions/resolve-pins
        with:
          ci-tooling-path: ${{ github.workspace }}
          dispatch-pins: ${{ inputs.package-pins || 'provide-foundation@from-dispatch' }}
          variable-pins: 'provide-foundation@from-variable'

      - name: ✅ Assert dispatch wins over the variable
        env:
          PINS: ${{ steps.dispatch.outputs.pins }}
        run: |
          ci/assert-pins.sh "dispatch precedence" 1 '"layer": "dispatch"'

      # Layer 6: sibling matching, which needs a real API lookup. `main` exists
      # in provide-foundation and no repository is named after this branch, so
      # the first is expected to match and the second not to.
      - name: 📌 Resolve by sibling-branch match
        id: siblings
        uses: ./actions/resolve-pins
        with:
          ci-tooling-path: ${{ github.workspace }}
          auto-pin-siblings: 'true'
          sibling-repos: 'provide-foundation,provide-testkit'

      - name: ✅ Assert sibling matching found the branch
        if: github.ref_name == 'main'
        env:
          PINS: ${{ steps.siblings.outputs.pins }}
        run: |
          ci/assert-pins.sh "auto sibling" 2 '"layer": "auto-sibling"' 'provide-foundation@main' 'provide-testkit@main'

      # On a branch, no sibling has a matching branch name, so the same lookup
      # must come back empty rather than guessing.
      - name: ✅ Assert sibling matching found nothing off main
        if: github.ref_name != 'main'
        env:
          PINS: ${{ steps.siblings.outputs.pins }}
        run: |
          ci/assert-pins.sh "auto sibling (no match)" 0

      # With no sibling-repos given, candidates come from this project's own
      # dependencies. ci-tooling declares none, so the lookup must find nothing
      # rather than erroring on an empty list.
      - name: 📌 Resolve siblings with no list supplied
        id: derived
        uses: ./actions/resolve-pins
        with:
          ci-tooling-path: ${{ github.workspace }}
          auto-pin-siblings: 'true'

      - name: ✅ Assert the derived path ran cleanly
        env:
          PINS: ${{ steps.derived.outputs.pins }}
        run: |
          ci/assert-pins.sh "derived siblings" 0

      # A pin outside the allowlist must fail the step, not be quietly dropped.
      - name: 📌 Reject a pin outside the allowlist
        id: hostile
        continue-on-error: true
        uses: ./actions/resolve-pins
        with:
          ci-tooling-path: ${{ github.workspace }}
          variable-pins: 'attacker/evil@main'
          allowed-orgs: 'github.com/provide-io/*'

      - name: ✅ Assert the hostile pin was rejected
        run: |
          test "${{ steps.hostile.outcome }}" = "failure" \
            || { echo "::error::allowlist did not reject an out-of-org pin"; exit 1; }
          echo "✅ allowlist rejected an out-of-org pin"

  # ==================================================================================
  # 📊 Test Summary
  # ==================================================================================
  test-summary:
    name: 📊 Test Summary
    needs: [
      test-setup-python-env,
      test-python-quality,
      test-python-test,
      test-python-build,
      test-pin-layers
    ]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 📊 Generate Test Summary
        shell: bash
        run: |
          echo "## 🧪 Action Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Action | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| setup-python-env | ${{ needs.test-setup-python-env.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| python-quality | ${{ needs.test-python-quality.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| python-test | ${{ needs.test-python-test.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| python-build | ${{ needs.test-python-build.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| pin layers | ${{ needs.test-pin-layers.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          # Check overall status
          if [ "${{ needs.test-setup-python-env.result }}" = "success" ] && \
             [ "${{ needs.test-python-quality.result }}" = "success" ] && \
             [ "${{ needs.test-python-test.result }}" = "success" ] && \
             [ "${{ needs.test-python-build.result }}" = "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎉 **All tests passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Some tests failed**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
